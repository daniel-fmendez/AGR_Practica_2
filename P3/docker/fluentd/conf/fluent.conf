<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type syslog
  port 5140
  tag syslog
  bind 0.0.0.0
  protocol_type tcp
</source>

<match **>
  @type file
  path /fluentd/output/output.log
  append true
  <buffer>
    @type file
    path /var/lib/fluentd/buffer  
    flush_mode immediate 
    retry_max_times 5  
  </buffer>
</match>
