apiVersion: v1
kind: Pod
metadata:
  name: host1
  labels:
    rol: host
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [ 
        {
          "name": "bridge-ra-h1",
          "interface": "eth1",
          "ips": ["10.0.1.2/24"],
          "gateway": "10.0.1.1"
        }
      ]
spec:
  containers:
    - name: host1
      image: python:3.6-alpine
      command: ["/bin/sh", "-c"]
      args:
        - |         
          ip route del default
          ip route add default via 10.0.1.1 dev eth1
          sleep infinity
      securityContext:
        privileged: true
        capabilities:
          add:
          - NET_ADMIN 